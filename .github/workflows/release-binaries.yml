name: Native Binary Release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build from (for example: v1.7.2)"
        required: false
        type: string

# Builds run every dependency's build script, so they get a read-only token.
# Only the upload-release job below can write to the repository.
permissions:
  contents: read

env:
  # Highest glibc a *-gnu binary may require. Linux builds are cross-linked
  # against this floor so the artifacts do not inherit the runner's glibc.
  GLIBC_FLOOR: "2.17"
  ZIG_VERSION: "0.13.0"
  CARGO_ZIGBUILD_VERSION: "0.23.0"

jobs:
  native-binaries:
    name: Build and Upload Native Binaries
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: corgea
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary_name: corgea
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary_name: corgea
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            binary_name: corgea
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: corgea
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: corgea
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: corgea.exe

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Install Rust Target
        run: rustup target add ${{ matrix.target }}

      - name: Install Zig
        if: runner.os == 'Linux'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
          # Release builds must not restore caches another run could have written.
          use-cache: false

      - name: Install cargo-zigbuild
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-zigbuild@${{ env.CARGO_ZIGBUILD_VERSION }}

      - name: Build Binary (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          build_target="${{ matrix.target }}"
          if [[ "$build_target" == *-gnu ]]; then
            build_target="${build_target}.${GLIBC_FLOOR}"
          fi
          cargo zigbuild --release --locked --target "$build_target"

      - name: Build Binary (macOS and Windows)
        if: runner.os != 'Linux'
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Verify Linux Runtime Compatibility
        if: runner.os == 'Linux'
        shell: bash
        run: |
          scripts/check-linux-binary.sh \
            "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" \
            "${{ matrix.target }}"

      # The aarch64 artifacts are cross-built, so nothing else in CI would ever
      # execute them. Run them under qemu to catch a binary that passes the
      # header checks but cannot actually start.
      - name: Smoke Test Linux Binary
        if: runner.os == 'Linux'
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/${{ matrix.binary_name }}"

          case "${{ matrix.target }}" in
            aarch64-*-gnu)
              sudo apt-get update -qq
              sudo apt-get install -y -qq qemu-user-static libc6-arm64-cross
              qemu-aarch64-static -L /usr/aarch64-linux-gnu "$binary" --version
              ;;
            aarch64-*-musl)
              sudo apt-get update -qq
              sudo apt-get install -y -qq qemu-user-static
              qemu-aarch64-static "$binary" --version
              ;;
            *)
              "$binary" --version
              ;;
          esac

      # Release builds are named after the tag so they match the release they are
      # attached to (npm-publish.yml looks them up by tag). Branch builds have no
      # tag, so they fall back to the Cargo.toml version.
      - name: Resolve Asset Name
        id: asset
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ -n "$INPUT_TAG" ]]; then
            version="$INPUT_TAG"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="v$(cargo metadata --no-deps --format-version 1 \
              | jq -r '.packages[] | select(.name == "corgea") | .version')"
          fi

          # The version ends up in file names and shell commands; accept only
          # a plain release version.
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Could not resolve a valid release version: $version" >&2
            exit 1
          fi

          echo "zip=corgea-${version}-${{ matrix.target }}.zip" >> "$GITHUB_OUTPUT"

      - name: Archive Binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          ZIP_NAME: ${{ steps.asset.outputs.zip }}
        run: |
          zip -j "$ZIP_NAME" \
            "target/${{ matrix.target }}/release/${{ matrix.binary_name }}"

      - name: Archive Binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ZIP_NAME: ${{ steps.asset.outputs.zip }}
        run: |
          Compress-Archive `
            -Path "target\${{ matrix.target }}\release\${{ matrix.binary_name }}" `
            -DestinationPath "$env:ZIP_NAME" `
            -Force

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries-${{ matrix.target }}
          path: ${{ steps.asset.outputs.zip }}
          if-no-files-found: error

  upload-release:
    name: Attach Binaries to GitHub Release
    needs: native-binaries
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Binary Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binaries-*
          merge-multiple: true
          path: release-assets

      # Uses the gh CLI that ships on the runner rather than a third-party
      # action, so nothing outside GitHub handles the write token.
      - name: Upload to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Refusing to release from non-release ref: $RELEASE_TAG" >&2
            exit 1
          fi

          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes ""
          fi

          gh release upload "$RELEASE_TAG" release-assets/*.zip --clobber
