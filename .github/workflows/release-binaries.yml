name: Native Binary Release

on:
  push:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build from (for example: v1.7.2)"
        required: false
        type: string

permissions:
  contents: write

env:
  # Highest glibc a *-gnu binary may require. Linux builds are cross-linked
  # against this floor so the artifacts do not inherit the runner's glibc.
  GLIBC_FLOOR: "2.17"
  ZIG_VERSION: "0.13.0"
  CARGO_ZIGBUILD_VERSION: "0.23.0"

jobs:
  native-binaries:
    name: Build and Upload Native Binaries
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: corgea
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary_name: corgea
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary_name: corgea
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            binary_name: corgea
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: corgea
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: corgea
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: corgea.exe

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust Target
        run: rustup target add ${{ matrix.target }}

      - name: Install Zig
        if: runner.os == 'Linux'
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install cargo-zigbuild
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild@${{ env.CARGO_ZIGBUILD_VERSION }}

      - name: Build Binary (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          build_target="${{ matrix.target }}"
          if [[ "$build_target" == *-gnu ]]; then
            build_target="${build_target}.${GLIBC_FLOOR}"
          fi
          cargo zigbuild --release --target "$build_target"

      - name: Build Binary (macOS and Windows)
        if: runner.os != 'Linux'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Verify Linux Runtime Compatibility
        if: runner.os == 'Linux'
        shell: bash
        run: |
          scripts/check-linux-binary.sh \
            "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" \
            "${{ matrix.target }}"

      # The aarch64 artifacts are cross-built, so nothing else in CI would ever
      # execute them. Run them under qemu to catch a binary that passes the
      # header checks but cannot actually start.
      - name: Smoke Test Linux Binary
        if: runner.os == 'Linux'
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/${{ matrix.binary_name }}"

          case "${{ matrix.target }}" in
            aarch64-*-gnu)
              sudo apt-get update -qq
              sudo apt-get install -y -qq qemu-user-static libc6-arm64-cross
              qemu-aarch64-static -L /usr/aarch64-linux-gnu "$binary" --version
              ;;
            aarch64-*-musl)
              sudo apt-get update -qq
              sudo apt-get install -y -qq qemu-user-static
              qemu-aarch64-static "$binary" --version
              ;;
            *)
              "$binary" --version
              ;;
          esac

      - name: Archive Binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          zip -j "corgea-${{ matrix.target }}.zip" \
            "target/${{ matrix.target }}/release/${{ matrix.binary_name }}"

      - name: Archive Binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "target\${{ matrix.target }}\release\${{ matrix.binary_name }}" `
            -DestinationPath "corgea-${{ matrix.target }}.zip" `
            -Force

      - name: Upload to GitHub Release (tags)
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: "corgea-${{ matrix.target }}.zip"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload as Artifact (branches)
        if: ${{ !startsWith(github.ref, 'refs/tags/') && inputs.tag == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: "corgea-${{ matrix.target }}.zip"
