name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-x86:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          # Pinned: on the ubuntu-26.04 image the manylinux2014 i686 container
          # cannot resolve vault.centos.org, so its libatomic install fails
          # before maturin runs.
          - runner: ubuntu-24.04
            target: x86_64
          - runner: ubuntu-24.04
            target: x86

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare resilient maturin download for manylinux Docker
        run: |
          bin_dir="${RUNNER_TEMP}/maturin-docker-bin"
          mkdir -p "$bin_dir"
          cat > "$bin_dir/curl" <<'EOF'
          #!/bin/bash
          set -euo pipefail
          if [[ " $* " == *" PyO3/maturin/releases "* ]]; then
            exec /usr/bin/curl --fail --retry 5 --retry-delay 3 --retry-all-errors "$@"
          fi
          exec /usr/bin/curl "$@"
          EOF
          chmod +x "$bin_dir/curl"
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          maturin-version: v1.15.0
          args: --release --locked --out dist
          manylinux: auto
          docker-options: -v ${{ runner.temp }}/maturin-docker-bin/curl:/usr/local/bin/curl:ro
          before-script-linux: |
            # If we're running on rhel centos, install needed packages.
            if command -v yum &> /dev/null; then
                yum update -y && yum install -y perl-core openssl openssl-devel pkgconfig libatomic
            else
                # If we're running on debian-based system.
                apt update -y && apt-get install -y libssl-dev openssl pkg-config musl-tools
            fi
      - name: Assert manylinux wheel compatibility tags
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          if ((${#wheels[@]} == 0)); then
            echo "No wheels found in dist/"
            exit 1
          fi
          for wheel in "${wheels[@]}"; do
            base=$(basename "$wheel")
            if [[ "$base" == *manylinux_2_3[0-9]* ]]; then
              echo "Wheel tag too new for broad Linux support: $base"
              exit 1
            fi
            if [[ ! "$base" =~ manylinux2014 ]]; then
              echo "Expected manylinux2014 compatibility tag, got: $base"
              exit 1
            fi
            echo "OK: $base"
          done
      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist

  windows:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: windows-latest
            target: x64
          - runner: windows-latest
            target: x86
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          maturin-version: v1.15.0
          args: --release --locked --out dist
      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist

  macos:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: macos-latest
            target: x86_64
          # macOS 14 images retire on 2026-11-02 (actions/runner-images#13518).
          - runner: macos-15
            target: aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          maturin-version: v1.15.0
          args: --release --locked --out dist
      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.15.0
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Release
    runs-on: ubuntu-latest
    if: "startsWith(github.ref, 'refs/tags/v')"
    needs: [linux-x86, windows, macos, sdist]
    # Publishing waits for approval in the release environment, which only
    # admits main and v* tags.
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      - name: Publish to PyPI
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          maturin-version: v1.15.0
          command: upload
          args: --non-interactive --skip-existing wheels-*/*
