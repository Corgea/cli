name: Publish npm Package

on:
  # The prepare job only accepts a successful tag push from this repository
  # and an existing vX.Y.Z tag, and publishing waits for approval in the
  # release environment.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["Native Binary Release"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish from (for example: v1.7.2)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    # Only a successful tag-push run of this repository's own release workflow
    # may publish. Branch pushes also run that workflow, and branch names are
    # not protected the way v* tags are.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        startsWith(github.event.workflow_run.head_branch, 'v')
      )
    outputs:
      tag_name: ${{ steps.resolve.outputs.tag_name }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve Tag and Version
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG_NAME="$INPUT_TAG"
          else
            TAG_NAME="$RUN_HEAD_BRANCH"
          fi

          # Ref names reach later steps; accept only a plain release tag.
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Refusing to publish from non-release ref: $TAG_NAME" >&2
            exit 1
          fi

          # Require the release tag to exist. Peeled (^{}) entries resolve
          # annotated tags to their commit.
          TAG_REFS="$(git ls-remote --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${TAG_NAME}" "refs/tags/${TAG_NAME}^{}")"
          TAG_SHA="$(awk '$2 ~ /\^\{\}$/ { print $1 }' <<<"$TAG_REFS")"
          if [ -z "$TAG_SHA" ]; then
            TAG_SHA="$(awk '{ print $1; exit }' <<<"$TAG_REFS")"
          fi
          if [ -z "$TAG_SHA" ]; then
            echo "Tag $TAG_NAME does not exist" >&2
            exit 1
          fi

          # The workflow_run head_branch can name a branch as well as a tag, so a
          # branch named like a release tag would also pass the checks above.
          # Require the triggering run to have built the tagged commit.
          if [ "$EVENT_NAME" != "workflow_dispatch" ] && [ "$RUN_HEAD_SHA" != "$TAG_SHA" ]; then
            echo "Run commit $RUN_HEAD_SHA does not match tag $TAG_NAME ($TAG_SHA)" >&2
            exit 1
          fi

          VERSION="${TAG_NAME#v}"
          echo "tag_name=${TAG_NAME}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

  publish:
    name: Publish @corgea/cli
    needs: prepare
    runs-on: ubuntu-latest
    # Trusted publishing: npm exchanges this job's OIDC token for a short-lived
    # publish credential, so no long-lived npm token is stored in the repository.
    # The release environment requires a reviewer and only admits main and v* tags.
    environment: release
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    env:
      TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
      PACKAGE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag_name }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer.
      - name: Check npm version
        run: |
          npm --version
          node -e '
            const [maj, min, pat] = process.argv[1].split(".").map(Number);
            if (maj < 11 || (maj === 11 && (min < 5 || (min === 5 && pat < 1)))) {
              console.error("npm >= 11.5.1 is required for trusted publishing");
              process.exit(1);
            }
          ' "$(npm --version)"

      - name: Set package version from tag
        run: npm version "$PACKAGE_VERSION" --no-git-tag-version

      - name: Download release binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release-assets
          gh release download "$TAG_NAME" --dir release-assets

      - name: Install dev dependencies
        run: npm ci --ignore-scripts

      - name: Bundle binaries into vendor/
        run: node scripts/npm/bundle-binaries.js release-assets "$TAG_NAME"

      - name: Publish @corgea/cli
        run: |
          if npm view "@corgea/cli@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "@corgea/cli@${PACKAGE_VERSION} already exists on npm, skipping."
            exit 0
          fi

          npm publish --access public --provenance
