<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>__DOCUMENT_TITLE__</title>
  <style>
    :root { color-scheme: light; --ink: #17211b; --muted: #68736c; --paper: #f4f1e9; --panel: #fffdf8; --line: #d8d4c9; --accent: #176b4d; --danger: #9d2f2f; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.55 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(1180px, calc(100% - 40px)); margin: 0 auto; padding: 56px 0 88px; }
    header { display: grid; gap: 16px; padding-bottom: 28px; border-bottom: 1px solid var(--line); }
    .eyebrow { margin: 0; color: var(--accent); font-size: 12px; font-weight: 750; letter-spacing: .14em; text-transform: uppercase; }
    h1, h2, h3 { line-height: 1.12; letter-spacing: -.025em; }
    h1 { max-width: 850px; margin: 0; font-size: clamp(34px, 6vw, 68px); font-weight: 650; }
    h2 { margin: 0; font-size: 28px; }
    h3 { margin: 0; font-size: 18px; }
    p { margin: 0; }
    .lede { max-width: 760px; color: var(--muted); font-size: 18px; }
    .meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
    .pill { border: 1px solid var(--line); border-radius: 999px; background: var(--panel); padding: 6px 10px; color: var(--muted); font-size: 12px; }
    .pill.pass { border-color: #9bc9b7; color: var(--accent); }
    .pill.fail { border-color: #d8a5a5; color: var(--danger); }
    .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; margin: 28px 0 52px; overflow: hidden; border: 1px solid var(--line); border-radius: 16px; background: var(--line); }
    .summary > div { min-height: 112px; background: var(--panel); padding: 20px; }
    .summary strong { display: block; margin-bottom: 6px; font-size: 24px; font-weight: 650; }
    .summary span { color: var(--muted); }
    .scenario { margin-top: 28px; padding: 30px; border: 1px solid var(--line); border-radius: 20px; background: var(--panel); box-shadow: 0 18px 50px rgba(48, 43, 31, .06); }
    .scenario-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 20px; align-items: start; }
    .scenario-id { color: var(--muted); font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
    .details { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 24px; margin: 22px 0 26px; padding: 18px 0; border-block: 1px solid var(--line); }
    .detail dt { margin-bottom: 3px; color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
    .detail dd { margin: 0; }
    .gallery { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
    figure { margin: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 12px; background: #ece8de; }
    figure img { display: block; width: 100%; height: auto; background: white; }
    figcaption { padding: 12px 14px; border-top: 1px solid var(--line); color: var(--muted); background: var(--panel); }
    figcaption strong { display: block; color: var(--ink); }
    .compare { margin-top: 18px; }
    .compare-stage { position: relative; overflow: hidden; border: 1px solid var(--line); border-radius: 12px; background: white; --position: 50%; }
    .compare-stage img { display: block; width: 100%; height: auto; }
    .compare-stage .after { position: absolute; inset: 0; clip-path: inset(0 calc(100% - var(--position)) 0 0); }
    .compare-stage::after { content: ""; position: absolute; top: 0; bottom: 0; left: var(--position); width: 2px; transform: translateX(-1px); background: white; box-shadow: 0 0 0 1px rgba(0,0,0,.18); pointer-events: none; }
    .compare input { width: 100%; margin: 10px 0 0; accent-color: var(--accent); }
    .note, .findings, .checks { margin-top: 18px; padding: 16px 18px; border-left: 3px solid var(--line); background: #f8f5ee; }
    .findings { border-color: var(--danger); }
    ul, ol { margin: 8px 0 0; padding-left: 22px; }
    footer { margin-top: 50px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--muted); }
    @media (max-width: 760px) { main { width: min(100% - 24px, 1180px); padding-top: 30px; } .summary, .gallery, .details { grid-template-columns: 1fr; } .scenario { padding: 20px; } .scenario-head { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    __REPORT_BODY__
    <footer>Generated from reproducible visual evidence. Screenshots support validation; they do not replace behavioral checks.</footer>
  </main>
  <script>
    document.querySelectorAll('[data-compare]').forEach((comparison) => {
      const stage = comparison.querySelector('.compare-stage');
      const range = comparison.querySelector('input[type="range"]');
      range.addEventListener('input', () => stage.style.setProperty('--position', `${range.value}%`));
    });
  </script>
</body>
</html>
